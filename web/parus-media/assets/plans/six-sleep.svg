<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38 -26 763 549" role="img" aria-labelledby="title desc"><title id="title">Парус 6 × 2,4 м: меблированная планировка</title><desc id="desc">План бани Парус 6 × 2,4 м. Печь, полки, мебель, расположение помещений и направления открывания дверей. Размеры указаны снаружи. Площади помещений ориентировочные.</desc><rect x="-38" y="-26" width="763" height="549" fill="#fbfbf5"/><defs><clipPath id="building"><rect x="30" y="54" width="627" height="244"/></clipPath></defs><defs>
