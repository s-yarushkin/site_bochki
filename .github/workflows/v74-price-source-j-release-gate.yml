name: V74 release price source J consistency

on:
  push:
    branches: [fix/v74-price-source-j-release-20261019]
  pull_request:
    branches: [release/v74-content-20261019]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source column J and 20 public prices
        run: node scripts/verify-v74-public-prices.mjs
      - name: Run full Node JS/contract tests, including relay/legacy history
        run: npm run check
      - name: Rebuild SEO site pages from the same pricebook
        run: node scripts/build-search-pages.mjs
      - name: Assert regenerated SEO pages are identical
        run: |
          git diff --exit-code -- bani/ dostavka-i-ustanovka/ voprosy/ kontakty/ sitemap.xml robots.txt llms.txt seo/pages.json
      - name: Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser model price and base kit
        run: python tests/browser_v74_base_kit.py
      - name: Browser mobile price and lead route
        run: python tests/browser_mobile_acceptance.py
      - name: Browser nine SEO pages
        run: python tests/browser_search_smoke.py
