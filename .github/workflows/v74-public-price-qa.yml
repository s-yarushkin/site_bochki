name: V74-02 Google Sheet public base price verification
on:
  push:
    branches: [feat/v74-02-sheet-priced-base-20261019]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v74-02-sheet-priced-base-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact public-price spreadsheet snapshot, 20 of 20
        run: node scripts/verify-v74-public-prices.mjs
      - name: Verify live Google source when read-only OAuth credentials configured
        env:
          DACHAPAR_SHEETS_ID: ${{ secrets.DACHAPAR_SHEETS_ID }}
          DACHAPAR_SHEETS_READ_TOKEN: ${{ secrets.DACHAPAR_SHEETS_READ_TOKEN }}
        run: |
          if [ -n "$DACHAPAR_SHEETS_ID" ] && [ -n "$DACHAPAR_SHEETS_READ_TOKEN" ]; then
            node scripts/verify-v74-public-prices.mjs --live
          else
            echo "LIVE_GOOGLE_SHEET_VERIFICATION=NOT_RUN (read-only credentials absent)"
          fi
      - name: Rebuild all indexed SEO price pages from canonical public pricebook
        run: node scripts/build-search-pages.mjs
      - name: Node and historical quote regression
        run: npm run check
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Mobile browser regression
        run: python tests/browser_mobile_acceptance.py
      - name: Search page browser smoke
        run: python tests/browser_search_smoke.py
      - name: Commit only generated public SEO files
        run: |
          git add bani/ dostavka-i-ustanovka/ voprosy/ kontakty/ sitemap.xml robots.txt llms.txt seo/pages.json
          if ! git diff --cached --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "build(v74-02): generated SEO pages from rounded 20-SKU public prices"
            git push origin HEAD:feat/v74-02-sheet-priced-base-20261019
          fi
