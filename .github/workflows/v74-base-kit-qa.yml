name: V74-03 catalogue base kit browser acceptance
on:
  pull_request:
    branches: [plan/v74-customer-experience-20261019]
    paths:
      - 'assets/css/v74-base-kit.css'
      - 'assets/js/app.js'
      - 'index.html'
      - 'tests/browser_v74_base_kit.py'
      - '.github/workflows/v74-base-kit-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Existing Node contract tests
        run: npm run check
      - name: Browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Four models base→builder; sun/rain, 5 resolutions
        run: python tests/browser_v74_base_kit.py
      - name: Existing mobile regressions
        run: python tests/browser_mobile_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v74-03-model-base-screenshots-${{ github.run_id }}
          path: docs/v74/artifacts/03-base/screenshots/
          if-no-files-found: warn
          retention-days: 30
