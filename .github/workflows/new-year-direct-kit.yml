name: New Year Direct materials

on:
  pull_request:
    paths:
      - "marketing/new-year-2027-direct/**"
      - "web/data/catalog-pricebook.json"
      - "concepts/new-year-2027/index.html"
      - ".github/workflows/new-year-direct-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate copy, prices, anchors and four images; build handoff
        run: python marketing/new-year-2027-direct/build-kit.py
      - uses: actions/upload-artifact@v4
        with:
          name: dachapar-new-year-2027-direct-kit
          path: output/new-year-2027-direct-kit.zip
          if-no-files-found: error
          retention-days: 30
