name: Home hero preview

on:
  pull_request:
    paths:
      - "concepts/home-hero/**"
      - "tests/home-hero*"
      - "web/data/catalog-pricebook.json"
      - ".github/workflows/home-hero-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==12.0.0
      - run: node --test tests/home-hero.test.mjs tests/pricing-parity.test.mjs tests/analytics.test.mjs
      - run: python tests/home-hero-build.test.py -v
      - run: python concepts/home-hero/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: dachapar-home-hero-preview
          path: output/home-hero-review.zip
          if-no-files-found: error
          retention-days: 30
